<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>猫猫 · 头号冒险</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><div><span class="eyebrow">A LITTLE CAT, A BIG LEAP</span><h1>猫猫 · 头号冒险 <small>试玩版 01</small></h1></div><button id="restart">重新开始 ↻</button></header><section class="board"><canvas id="game" width="1100" height="620" aria-label="猫猫平台跳跃游戏"></canvas><div id="toast" role="status">把头抛向远方，再一起回家。</div></section><footer><div><b>A / D 或 ← / →</b><span>移动</span></div><div><b>短按空格</b><span>跳跃</span></div><div><b>鼠标瞄准 · 长按空格</b><span>蓄力，松开发射（≥0.22秒）</span></div><div><b>Tab</b><span>切换头 / 身体</span></div><div><b>R</b><span>回到检查点</span></div></footer><section class="notes"><span>01 / 踩住薄荷色开关，打开桥梁</span><span>02 / 收集三颗星星</span><span>03 / 碰面合体，一起抵达小屋</span></section><p class="hint">也可以用 Q / E 调整角度。身体跳得较低，头部跳得较高；分离后必须相碰才能合体。</p></main><script src="game.js"></script></body></html>
